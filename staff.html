<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subora staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; connect-src https://znywpatsqmmxkbqtybrr.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1f14;--card:#16291b;--line:#27402d;--ink:#eef5ea;--mute:#9db3a1;--lime:#c6f23b;--bad:#ff8a80;--warn:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:36px 18px 60px}
main.wide{max-width:960px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--lime);color:#0f1f14;font:800 19px/1 system-ui;font-style:normal}
.brand b{font-size:19px}.brand span{color:var(--mute);font-size:13px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:20px;margin:0 0 6px}p{margin:8px 0}
.mute{color:var(--mute);font-size:14px}
label{display:block;font-size:14px;margin:14px 0 6px;color:var(--mute)}
input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#0c1810;color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--lime);outline-offset:1px}
input.code{font:600 26px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.35em;text-align:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 16px}
button.pri{background:var(--lime);color:#0f1f14;border-color:var(--lime);font-weight:700;width:100%;margin-top:18px}
button:disabled{opacity:.55;cursor:wait}
.err{margin-top:14px;padding:10px 12px;border-radius:10px;background:#3a1b1a;color:var(--bad);font-size:14px}
.note{margin-top:14px;padding:10px 12px;border-radius:10px;background:#2c2a14;color:var(--warn);font-size:14px}
.qr{display:block;margin:14px auto;background:#fff;padding:8px;border-radius:10px;width:200px;height:200px}
.key{display:block;word-break:break-all;font:14px ui-monospace,Menlo,Consolas,monospace;background:#0c1810;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar .who{font-weight:700}.bar .tm{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#1d3a24;color:var(--lime)}
.tag.amber{background:#3b3212;color:var(--warn)}
.tw{overflow-x:auto}
.empty{padding:26px 0;text-align:center;color:var(--mute)}
h2{font-size:15px;margin:22px 0 6px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#0c1810;color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--lime);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button.good{background:var(--lime);color:#0f1f14;border-color:var(--lime);font-weight:700}
button.bad{border-color:var(--bad);color:var(--bad)}
button.lnk{border:none;padding:4px 0;color:var(--lime);text-decoration:underline;background:none}
.pre{white-space:pre-wrap;word-break:break-word}.quote{padding:10px 12px;border-left:3px solid var(--line);background:#0c1810;border-radius:6px}
.thread .msg{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.thread .msg.cust{border-color:var(--lime)}.thread .msg p{margin:6px 0 0}
tr.item{cursor:pointer}tr.item:hover td{background:#10241a}
ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="card"><p class="mute">Loading…</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* CORE START — all sign-in logic lives here so it can be tested without a browser */

function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '\u20A6'+Number(n||0).toLocaleString('en-NG')}
function dtText(ts){if(!ts)return '';try{return new Date(ts).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}
function listHtml(a){return Array.isArray(a)&&a.length?'<ul>'+a.map(function(x){return '<li>'+escHtml(x)+'</li>'}).join('')+'</ul>':'<span class="mute">None given</span>'}
function kvHtml(rows){return '<dl class="kv">'+rows.filter(function(r){return r[1]!==null&&r[1]!==undefined&&r[1]!==''}).map(function(r){return '<dt>'+escHtml(r[0])+'</dt><dd>'+(r[2]?r[1]:escHtml(r[1]))+'</dd>'}).join('')+'</dl>'}
function tagHtml(t,cls){return '<span class="tag'+(cls?' '+cls:'')+'">'+escHtml(t)+'</span>'}
function reasonBox(label,help){return '<label for="x_reason">'+escHtml(label)+'</label><textarea id="x_reason" rows="3" maxlength="300"></textarea>'+(help?'<p class="mute" style="margin:4px 0 0">'+escHtml(help)+'</p>':'')}
function vendorBtn(id){return id?'<button type="button" data-a="vendor" data-id="'+escHtml(id)+'">View vendor</button>':''}

/* HTML for the open item. Pure: state in, string out, so it can be tested without a browser. */
function viewHtml(s){
  var v=s.view;if(!v)return '';
  var dis=s.busy?' disabled':'';
  var back='<p><button type="button" class="lnk" data-a="back">\u2190 Back</button></p>';
  if(v.loading)return back+'<p class="mute">Loading\u2026</p>';
  var d=v.data||{},h='';
  if(v.kind==='listing'){
    h=back+'<h1>Listing to approve</h1>'
      +kvHtml([['Title',d.title],['Store',(d.store_name||'')+(d.vendor_verified?' (verified)':' (not verified)')],['Category',d.category],['Price',money(d.price)],['Duration',d.duration],['Stock',d.stock==null?'':String(d.stock)],['Service',d.service],['Plan',d.plan],['Access type',d.access_type],['Kind',d.kind],['Image',d.image_url?'Provided (not shown here)':'None'],['Submitted',dtText(d.created_at)]])
      +'<h2>Description</h2><p class="pre">'+(d.description?escHtml(d.description):'<span class="mute">None given</span>')+'</p>'
      +'<h2>Features</h2>'+listHtml(d.features)+'<h2>Terms</h2>'+listHtml(d.terms)
      +'<p>'+vendorBtn(d.vendor_id)+'</p>'
      +'<div class="row"><button type="button" class="good" data-a="approve"'+dis+'>Approve</button></div>'
      +reasonBox('Reason (needed to reject, at least 5 characters)','The vendor sees this reason.')
      +'<div class="row"><button type="button" class="bad" data-a="reject"'+dis+'>Reject listing</button></div>';
  }else if(v.kind==='dispute'){
    var dp=d.dispute||{},o=d.order||{},ev=d.events||[],closed=dp.status==='resolved',esc2=dp.status==='escalated';
    h=back+'<h1>Dispute '+escHtml(dp.case_no||'')+'</h1><p>'+tagHtml(dp.status||'',closed?'':'amber')+(dp.outcome?' '+escHtml(dp.outcome):'')+'</p>'
      +kvHtml([['Order','#'+(o.order_no==null?'':o.order_no)],['Product',o.product],['Buyer',o.buyer_name],['Store',o.store_name],['Quantity',o.qty==null?'':String(o.qty)],['Total',money(o.total)],['Order status',o.status],['Buyer\u2019s reason',o.reason],['Opened',dtText(dp.created_at)],['Reply due',dtText(dp.due_at)],['Delivered',dtText(o.delivered_at)],['Completed',dtText(o.completed_at)],['Delivery items',(o.delivery||[]).length?String((o.delivery||[]).length):'']])
      +'<p>'+vendorBtn(o.vendor_id)+'</p><h2>Timeline</h2>'
      +(ev.length?'<div class="thread">'+ev.map(function(e){return '<div class="msg"><b>'+escHtml(e.who==='admin'?'Subora support':(e.actor_name||e.who||''))+'</b> <span class="mute">'+escHtml(e.who==='admin'?'':e.who||'')+' '+escHtml(dtText(e.created_at))+'</span><p class="pre">'+escHtml(e.body)+'</p></div>'}).join('')+'</div>':'<p class="mute">No messages yet.</p>');
    if(closed){h+='<p class="note">This case is closed.</p>'}
    else{
      h+='<label for="x_reply">Reply as Subora support</label><textarea id="x_reply" rows="3" maxlength="2000"></textarea><div class="row"><button type="button" data-a="reply"'+dis+'>Send reply</button></div>'
        +'<h2>Decision</h2>'+reasonBox('Reason (at least 10 characters)','Both buyer and vendor are told the outcome.')
        +'<div class="row"><button type="button" class="good" data-a="release"'+dis+'>Release to vendor</button>'
        +(esc2?'':'<button type="button" class="bad" data-a="refund"'+dis+'>Refund the buyer</button>')+'</div>'
        +(esc2?'<p class="note">A refund is already with the owner. You can still release to the vendor.</p>':'<p class="mute">A refund goes to the owner for approval. No money moves until the owner approves it.</p>');
    }
  }else if(v.kind==='flag'){
    h=back+'<h1>Blocked message</h1>'
      +kvHtml([['Sender side',d.side],['Buyer',d.buyer_name],['Why it was flagged',d.reason],['Flags from this sender today',d.sender_flags_today==null?'':String(d.sender_flags_today)],['Sent',dtText(d.created_at)]])
      +'<h2>Message</h2><p class="pre quote">'+escHtml(d.text)+'</p><p>'+vendorBtn(d.vendor_id)+'</p>'
      +'<div class="row"><button type="button" data-a="flag" data-s="dismissed"'+dis+'>Dismiss</button><button type="button" class="bad" data-a="flag" data-s="warned"'+dis+'>Warn sender</button></div>'
      +'<p class="mute">Warning sends the sender a short notice about keeping payments and chats on Subora.</p>';
  }else if(v.kind==='report'){
    h=back+'<h1>Report</h1>'
      +kvHtml([['About',d.kind],['Reason',d.reason],['Details',d.details],['Support level',d.support_level],['Sent',dtText(d.created_at)]])
      +(d.kind==='vendor'&&d.target_id?'<p>'+vendorBtn(d.target_id)+'</p>':'')
      +'<div class="row"><button type="button" data-a="report" data-s="dismissed"'+dis+'>Dismiss</button><button type="button" class="good" data-a="report" data-s="actioned"'+dis+'>Mark as actioned</button></div>';
  }else if(v.kind==='chat_ticket'){
    var tk=d.ticket||{},tr=d.transcript||[],tdone=tk.status==='resolved',tprog=tk.status==='in_progress',mine=!!tk.assigned_to_me;
    h=back+'<h1>Chat ticket '+escHtml(tk.ref||'')+'</h1><p>'+tagHtml(tprog?'in progress':(tk.status||''),tdone?'':'amber')+' '+tagHtml(tk.channel||'')+(tk.emailed?'':' '+tagHtml('Email not sent','amber'))+'</p>'
      +kvHtml([['Contact',tk.contact],['Customer note',tk.note],['Opened',dtText(tk.created_at)],['Taken by',tk.assigned_name?(mine?'You':tk.assigned_name):''],['Resolved',tk.resolved_at?dtText(tk.resolved_at):''],['Resolution',tk.resolution_note]])
      +(tk.masked?'<p class="mute">Emails, phone numbers and links are hidden. The team replies by email from the support inbox.</p>':'')
      +(!tk.emailed&&!tdone?'<p class="note">This ticket is saved, but the email to the support inbox did not send. Tell the owner so the customer gets a reply.</p>':'')
      +'<h2>Conversation</h2>'+(tr.length?'<div class="thread">'+tr.map(function(m){return '<div class="msg'+(m.role==='user'?' cust':'')+'"><b>'+(m.role==='user'?'Customer':'Assistant (AI)')+'</b> <span class="mute">'+escHtml(dtText(m.at))+'</span><p class="pre">'+escHtml(m.text)+'</p></div>'}).join('')+'</div>':'<p class="mute">No messages.</p>');
    if(tdone){h+='<div class="row"><button type="button" data-a="tkopen"'+dis+'>Reopen</button></div>'}
    else{
      if(!tprog)h+='<div class="row"><button type="button" class="good" data-a="tktake"'+dis+'>Take it</button></div>';
      else if(!mine)h+='<p class="note">'+escHtml(tk.assigned_name||'Someone')+' is handling this ticket.</p>';
      h+=reasonBox('Resolution note (at least 5 characters)','Say what was done. It is saved with the ticket and written to the audit log.')
        +'<div class="row"><button type="button" class="good" data-a="tkresolve"'+dis+'>Mark resolved</button>'+(tprog&&mine?'<button type="button" data-a="tkopen"'+dis+'>Put back in the queue</button>':'')+'</div>';
    }
  }else if(v.kind==='vendor'){
    var vd=d.vendor||{},pl=vd.plan||{},lc=d.listings||{},names=Object.keys(lc).sort();
    var plan=pl.plan_key||pl.plan||pl.name||pl.key||'';
    h=back+'<h1>'+escHtml(vd.store_name||'Vendor')+'</h1><p>'+(vd.suspended?tagHtml('Suspended','amber'):tagHtml('Active'))+' '+(vd.verified?tagHtml('Verified'):tagHtml('Not verified','amber'))+(vd.official?' '+tagHtml('Official'):'')+'</p>'
      +kvHtml([['Username',vd.username?'@'+vd.username:''],['Name',vd.full_name],['Verification',vd.kyc_status],['Plan',plan],['Strikes',vd.strikes==null?'':String(vd.strikes)],['Rating',vd.rating==null?'':String(vd.rating)],['Sales',vd.sales_count==null?'':String(vd.sales_count)],['Trust',vd.trust==null?'':String(vd.trust)],['Open disputes',d.open_disputes==null?'':String(d.open_disputes)],['Listings',names.map(function(k){return k+': '+lc[k]}).join(', ')],['Since',dtText(vd.created_at)],['Suspended because',vd.suspended?vd.suspended_reason:'']])
      +(vd.bio?'<h2>Bio</h2><p class="pre">'+escHtml(vd.bio)+'</p>':'')
      +'<h2>Actions</h2>'+reasonBox('Reason (at least 5 characters, needed to suspend or hide)','Written to the audit log. The owner is told about every suspension.')
      +'<div class="row">'+(vd.suspended?'<button type="button" class="good" data-a="reinstate"'+dis+'>Reinstate vendor</button>':'<button type="button" class="bad" data-a="suspend"'+dis+'>Suspend vendor</button>')+'</div>'
      +'<h2>Listings</h2>';
    var ls=v.listings||[];
    if(v.listErr)h+='<p class="mute">Could not load the listings.</p>';
    else if(!ls.length)h+='<p class="mute">No listings.</p>';
    else h+='<div class="tw"><table><thead><tr><th>Title</th><th>Status</th><th>Price</th><th></th></tr></thead><tbody>'+ls.map(function(p){
      var act=p.staff_hidden?'<button type="button" data-a="restore" data-id="'+escHtml(p.id)+'"'+dis+'>Restore</button>':(p.status==='live'?'<button type="button" data-a="hide" data-id="'+escHtml(p.id)+'"'+dis+'>Hide</button>':'');
      return '<tr><td>'+escHtml(p.title)+'<div class="mute">'+escHtml(p.category||'')+(p.staff_hidden&&p.staff_hidden_reason?' \u00B7 hidden: '+escHtml(p.staff_hidden_reason):'')+'</div></td><td>'+tagHtml(p.staff_hidden?'hidden by staff':p.status,p.staff_hidden?'amber':'')+'</td><td>'+escHtml(money(p.price))+'</td><td>'+act+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  return h;
}
function createStaffApp(deps){
  var sb=deps.sb;
  var pwUrl=deps.pwUrl||String(deps.loginUrl).replace('staff-login','staff-password');
  var IDLE_MS=deps.idleMs||30*60*1000, MAX_MS=deps.maxMs||8*3600*1000, BEAT_MS=deps.beatMs||4*60*1000;
  var S={step:'loading',busy:false,error:'',notice:'',enroll:null,factorId:null,name:'',queue:[],queueErr:'',idleLeft:IDLE_MS,maxLeft:MAX_MS,newDevice:false,forced:false,view:null,nav:[]};
  var lastActivity=deps.now(), lastBeat=deps.now(), started=deps.now(), timer=null;

  function snap(){return Object.assign({},S,{queue:S.queue.slice()})}
  function emit(){deps.onChange(snap())}
  function go(step){S.step=step;S.busy=false;S.error='';emit()}
  function busy(v){S.busy=v;emit()}
  function stopTimer(){if(timer){deps.clearInterval(timer);timer=null}}
  async function rpc(name,args){var r=await sb.rpc(name,args||{});if(r.error)throw r.error;return r.data}

  function deviceId(){
    var id=deps.storage.getItem('subora_staff_device');
    if(!id||id.length<16){id=deps.randomId();deps.storage.setItem('subora_staff_device',id)}
    return id;
  }
  async function hardSignOut(){
    S.view=null;S.nav=[];
    stopTimer();
    try{await sb.auth.signOut()}catch(e){}
    S.queue=[];S.enroll=null;S.factorId=null;
  }
  async function signOut(reason){
    try{await rpc('staff_end_session')}catch(e){}
    await hardSignOut();
    S.notice={idle:'You were signed out after 30 minutes without activity.',max:'Your 8-hour session ended. Sign in again.',ended:'Your session ended. Sign in again.',pwcancel:'You are signed out. Sign in again when you are ready to choose a new password.',elsewhere:'You were signed out because this account signed in somewhere else, or the session ended.'}[reason]||'You are signed out.';
    go('signin');
  }
  async function locked(){await hardSignOut();go('locked')}

  async function mfaStep(){
    var f=await sb.auth.mfa.listFactors();
    if(f.error)throw f.error;
    var verified=(f.data&&f.data.totp)||[];
    if(verified.length){S.factorId=verified[0].id;go('mfa_verify');return}
    var all=(f.data&&f.data.all)||[];
    for(var i=0;i<all.length;i++){
      if(all[i].factor_type==='totp'&&all[i].status!=='verified'){await sb.auth.mfa.unenroll({factorId:all[i].id})}
    }
    var e=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Subora staff'});
    if(e.error)throw e.error;
    S.factorId=e.data.id;S.enroll={qr:e.data.totp.qr_code,secret:e.data.totp.secret};
    go('mfa_enroll');
  }

  async function register(){
    var r=await rpc('staff_register_session',{p_device_id:deviceId()});
    return r||{ok:false,error:'no_answer'};
  }
  async function enterDashboard(){
    try{
      var q=await sb.from('staff_sessions').select('created_at').is('ended_at',null).order('created_at',{ascending:false}).limit(1);
      started=(q&&q.data&&q.data[0])?new Date(q.data[0].created_at).getTime():deps.now();
    }catch(e){started=deps.now()}
    lastActivity=deps.now();lastBeat=deps.now();
    S.notice='';
    go('dashboard');
    stopTimer();
    timer=deps.setInterval(tick,1000);
    await loadQueue();
  }
  async function registerAndEnter(){
    var r;
    try{r=await register()}catch(e){await hardSignOut();S.notice='';go('signin');S.error='Could not start your session. Check your connection and try again.';emit();return}
    if(r.ok){S.newDevice=!!r.new_device;await enterDashboard();return}
    if(r.error==='locked'){await locked();return}
    if(r.error==='password_change_required'){S.forced=true;go('pw_change');return}
    await hardSignOut();go('signin');
    S.error=r.error==='not_staff'?'This account is not set up as staff.':'Could not start your session. Sign in again.';emit();
  }

  async function resume(){
    var acc=await rpc('my_access');
    if(!acc||!acc.staff){await hardSignOut();go('signin');S.error='This account is not set up as staff.';emit();return}
    S.name=acc.display_name||'';
    if(acc.locked){await locked();return}
    var ps=null;try{ps=await rpc('staff_my_pw_state')}catch(e){ps=null}
    if(ps&&ps.must_change){S.forced=true;go('pw_change');return}
    if(acc.session_ok){await enterDashboard();return}
    if(acc.aal==='aal2'){await registerAndEnter();return}
    await mfaStep();
  }

  async function init(){
    try{
      var s=await sb.auth.getSession();
      if(!s||!s.data||!s.data.session){go('signin');return}
      await resume();
    }catch(e){go('signin')}
    try{
      sb.auth.onAuthStateChange(function(ev){
        if(ev==='SIGNED_OUT'&&S.step==='dashboard'){stopTimer();S.queue=[];S.notice='You were signed out because this account signed in somewhere else, or the session ended.';go('signin')}
      });
    }catch(e){}
  }

  async function signIn(email,password){
    S.error='';S.notice='';
    email=String(email||'').trim();
    if(!email||!password){S.error='Enter your email and password.';emit();return}
    busy(true);
    var res,body;
    try{
      res=await deps.fetch(deps.loginUrl,{method:'POST',headers:{'Content-Type':'application/json','apikey':deps.anonKey,'Authorization':'Bearer '+deps.anonKey},body:JSON.stringify({email:email,password:password})});
      try{body=await res.json()}catch(e){body={}}
    }catch(e){S.error='Could not reach the server. Check your connection.';busy(false);return}
    if(res.status===423||(body&&body.error==='account_locked')){await locked();return}
    if(res.status===401){S.error='Email or password is not right.';busy(false);return}
    if(res.status===403){S.error='This page cannot sign in from this address.';busy(false);return}
    if(res.status===400){S.error='Enter your email and password.';busy(false);return}
    if(!res.ok||!body||!body.ok||!body.access_token){S.error='Something went wrong. Try again in a moment.';busy(false);return}
    try{
      var st=await sb.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token});
      if(st.error)throw st.error;
      if(body.must_change){S.forced=true;go('pw_change');return}
      await resume();
    }catch(e){await hardSignOut();go('signin');S.error='Could not finish signing in. Try again.';emit()}
  }

  async function wrongCode(){
    var lk=false;

      if(v.error.name==='AuthRetryableFetchError'){S.error='Could not reach the server. Check your connection.';busy(false);return}

    }catch(e){S.error='Could not reach the server. Check your connection.';busy(false);return}
    if(res.status===423||(b&&b.error==='account_locked')){await locked();return}
    if(res.ok&&b&&b.ok){await hardSignOut();S.forced=false;S.notice='Password changed. Sign in with your new password.';go('signin');return}

  async function loadQueue(){
    try{
      var r=await rpc('staff_support_queue');

        S.queueErr='';
      }
    }catch(e){S.queueErr='Could not load the queue.'}
    lastBeat=deps.now();
    emit();
  }

  function tick(){
    var now=deps.now();
    S.idleLeft=IDLE_MS-(now-lastActivity);
    S.maxLeft=MAX_MS-(now-started);
    if(S.maxLeft<=0){signOut('max');return}
    if(S.idleLeft<=0){signOut('idle');return}
    // keep the server's idle clock moving while the person is actually working
    if(now-lastBeat>=BEAT_MS&&lastActivity>lastBeat){lastBeat=now;loadQueue();return}
    emit();
  }
  function activity(){lastActivity=deps.now()}

      if(s.error||s.busy){['x_reason','x_reply'].forEach(function(id){var el=document.getElementById(id);if(el)saved[id]=el.value})}
      body.innerHTML=html;body.setAttribute('data-html',html);
      Object.keys(saved).forEach(function(id){var el=document.getElementById(id);if(el)el.value=saved[id]});
    }
    // a new message appears at the top of the card: scroll to it once, never on timer repaints
    var mk=(s.error||'')+'|'+(s.notice||'');
    if(mk!==lastMsg){lastMsg=mk;if(s.error||s.notice)window.scrollTo(0,0)}
  }

  var t=0;
  ['mousemove','keydown','click','touchstart','scroll'].forEach(function(ev){window.addEventListener(ev,function(){var n=Date.now();if(n-t>1000){t=n;app.activity()}},{passive:true})});
  app.init();
})();
</script>
</body>
</html>
